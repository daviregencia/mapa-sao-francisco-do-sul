const de64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(senha) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
  const chave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: de64(DADOS.sal), iterations: DADOS.it, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: de64(DADOS.iv) }, chave, de64(DADOS.c)));
  document.open(); document.write(html); document.close();
}
const LEMBRAR = 'mapa-sfs-senha';
document.getElementById('f').onsubmit = async ev => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e'), s = document.getElementById('s').value;
  const lembrar = document.getElementById('lembrar').checked;
  b.disabled = true; b.textContent = 'Abrindo…'; e.textContent = '';
  try {
    await abrir(s);
    if (lembrar) localStorage.setItem(LEMBRAR, s);
  } catch (_) { e.textContent = 'Senha incorreta.'; b.disabled = false; b.textContent = 'Abrir'; }
};
const salva = localStorage.getItem(LEMBRAR);
if (salva) abrir(salva).catch(() => localStorage.removeItem(LEMBRAR));
